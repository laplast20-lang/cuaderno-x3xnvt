name: Actualizar tipo de cambio (BCB)

on:
  schedule:
    - cron: "15 12,17,22 * * *"   # tres veces al dia (hora UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer el Banco Central de Bolivia
        run: python3 scripts/actualizar_tc.py
      - name: Guardar si cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tipos-de-cambio.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Tipo de cambio BCB $(date -u +%F)"; git push; fi
